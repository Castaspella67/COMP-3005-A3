
<!DOCTYPE html>
<html>
    <head>
        <title>Student Database</title>
        <meta name="description" content="COMP 3005 stuff">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <h1>Students</h1>
        <section>
            <h2>Add Student</h2>
            <form action="/add" method="POST">

                <input type="text" name="first_name"
                    placeholder="First Name" required>

                <input type="text" name="last_name"
                    placeholder="Last Name" required>

                <input type="email" name="email"
                    placeholder="Email" required>

                <input type="date" name="enrollment_date" required>

                <button type="submit">Add Student</button>

            </form>
        </section>
    
        <h2>All Students</h2>

        <table>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Enrollment Date</th>
                <th>Email</th>
            </tr>

            {% for student in students %}

            <tr>
                <td>{{ student.student_id }}</td>

                <td>{{ student.first_name }}</td>

                <td>{{ student.last_name }}</td>

                <td>{{ student.enrollment_date }}</td>


                <td>
                    <!-- UPDATE EMAIL -->
                    <form action="/update/{{ student.student_id }}"
                        method="POST">

                        <input type="email" name="email"
                            value="{{ student.email }}" required>

                        <button type="submit">Update Email</button>

                    </form>
                </td>

                <td>
                    <!-- DELETE STUDENT -->
                    <form action="/delete/{{ student.student_id }}" method="POST">
                        <button type="submit">Delete this child?</button>
                    </form>
                </td>
            </tr>

            {% endfor %}

        </table>

    </body>
    <img src="{{ url_for('static', filename='rabbits.jpg') }}" width="500"></a>
</html>
